{% extends "base.html" %}
{% set active_page = "resume_builder" %}

{% block content %}
<div class="resume-builder-wrap">
  <div class="container">
    <div class="panel preview-panel">
      <h1>Resume Preview</h1>

      <div id="resumePreview">
        <p style="text-align: center; color: #999; margin-top: 100px">
          Loading resume data...
        </p>
      </div>

      <div class="action-buttons">
        <button class="btn btn-secondary" id="downloadBtn" style="flex: 1">
          Download PDF
        </button>
        <button class="btn" id="copyBtn" style="flex: 1">Copy HTML</button>
      </div>
    </div>

    <div class="panel config-panel">
      <h1>Resume Configurer</h1>
      <p class="subtitle">Edit JSON — preview updates live</p>

      <div class="control-group" style="display: flex; gap: 8px; margin-bottom: 16px; align-items: center; justify-content: space-between; background: #f8f9ff; padding: 12px; border-radius: 8px;">
        <div style="display: flex; gap: 8px;">
          <button class="btn" id="fetchBtn" style="margin-top: 0; width: auto; padding: 8px 16px;">Reload</button>
          <button class="btn" id="saveBtn" style="margin-top: 0; width: auto; padding: 8px 16px; background: linear-gradient(135deg, #28a745, #20c997);">Save</button>
        </div>
        <div style="display: flex; align-items: center; gap: 6px;">
          <input type="checkbox" id="autoSync" style="width: auto; margin-right: 4px;" checked />
          <label for="autoSync" style="display: inline; margin-bottom: 0; font-weight: normal; cursor: pointer; font-size: 13px;">Auto</label>
          <span id="syncIndicator" style="width: 8px; height: 8px; border-radius: 50%; background: #28a745; display: inline-block;"></span>
        </div>
      </div>

      <div class="form-group">
        <label for="jsonEditor">Source JSON (Editable)</label>
        <textarea id="jsonEditor" style="font-family: monospace; font-size: 12px; min-height: 320px; line-height: 1.4;" placeholder="Loading resumeinfo.json..."></textarea>
        <p id="jsonStatus" style="font-size: 12px; margin-top: 5px; color: #28a745; font-weight: bold;">Valid JSON</p>
      </div>

      <button class="btn" id="renderBtn">Render Manual Changes</button>

      <div class="control-group" style="margin-top: 16px; background: #f8f9ff; padding: 12px; border-radius: 8px;">
        <h3 style="margin-top: 0; margin-bottom: 10px; font-size: 13px; color: #333;">Layout Options</h3>

        <div style="margin-bottom: 8px;">
          <label for="marginSlider" style="display: inline; margin-bottom: 0; font-weight: normal; font-size: 13px;">Page Margin</label>
          <div style="display: flex; align-items: center; gap: 8px;">
            <input type="range" id="marginSlider" min="0.3" max="1.0" step="0.05" value="0.6" style="flex: 1;">
            <span id="marginValue" style="font-size: 12px; min-width: 36px;">0.6 in</span>
          </div>
        </div>

        <div style="margin-bottom: 8px;">
          <label for="lineSpacingSlider" style="display: inline; margin-bottom: 0; font-weight: normal; font-size: 13px;">Line Spacing</label>
          <div style="display: flex; align-items: center; gap: 8px;">
            <input type="range" id="lineSpacingSlider" min="1.0" max="2.0" step="0.1" value="1.4" style="flex: 1;">
            <span id="lineSpacingValue" style="font-size: 12px; min-width: 36px;">1.4</span>
          </div>
        </div>

        <div style="display: flex; gap: 12px; flex-wrap: wrap;">
          <div style="display: flex; align-items: center; gap: 4px;">
            <input type="checkbox" id="includeCourses" style="width: auto;" checked>
            <label for="includeCourses" style="display: inline; margin-bottom: 0; font-weight: normal; cursor: pointer; font-size: 13px;">Courses</label>
          </div>
          <div style="display: flex; align-items: center; gap: 4px;">
            <input type="checkbox" id="includeProjects" style="width: auto;" checked>
            <label for="includeProjects" style="display: inline; margin-bottom: 0; font-weight: normal; cursor: pointer; font-size: 13px;">Projects</label>
          </div>
          <div style="display: flex; align-items: center; gap: 4px;">
            <input type="checkbox" id="includeReferences" style="width: auto;" checked>
            <label for="includeReferences" style="display: inline; margin-bottom: 0; font-weight: normal; cursor: pointer; font-size: 13px;">References</label>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<link rel="stylesheet" href="/static/resume-builder/style.css" />
<style>
  /* Slimmer sidebar for this page */
  :root {
    --sidebar-width: 180px;
  }
  .sidebar-brand {
    padding: 16px 12px 12px !important;
  }
  .sidebar-brand h1 {
    font-size: 15px !important;
  }
  .sidebar-brand p {
    font-size: 11px !important;
  }
  .nav-item {
    padding: 8px 12px !important;
    font-size: 13px !important;
  }
  .sidebar-stats {
    padding: 12px 12px !important;
  }
  .sidebar-stats h3 {
    font-size: 10px !important;
  }
  .sidebar-footer {
    padding: 8px 12px !important;
    font-size: 10px !important;
  }
  .layout {
    min-height: 100vh;
  }
  .main {
    padding: 4px 8px !important;
  }
  .resume-builder-wrap .container {
    max-width: 100%;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 1fr 380px;
    gap: 12px;
    align-items: start;
  }
  .resume-builder-wrap .panel {
    background: white;
    border-radius: 10px;
    padding: 16px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    min-width: 0;
  }
  .resume-builder-wrap .preview-panel {
    overflow-x: auto;
  }
  .resume-builder-wrap .config-panel {
    position: sticky;
    top: 4px;
    max-height: calc(100vh - 16px);
    overflow-y: auto;
  }
  .resume-builder-wrap .btn {
    background: linear-gradient(135deg, #e37e5f 0%, #7aa9fa 100%);
    color: white;
    border: none;
    padding: 14px 30px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
    font-weight: 600;
    transition: transform 0.2s, box-shadow 0.2s;
    width: 100%;
    margin-top: 10px;
  }
  .resume-builder-wrap .btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
  }
  .resume-builder-wrap .btn-secondary {
    background: #6c757d !important;
  }
  .resume-builder-wrap .btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    transform: none;
  }
  .resume-builder-wrap h1 {
    color: #e37e5f;
    margin-bottom: 10px;
    font-size: 28px;
  }
  .resume-builder-wrap .subtitle {
    color: #666;
    margin-bottom: 25px;
    font-size: 14px;
  }
  .resume-builder-wrap label {
    display: block;
    margin-bottom: 8px;
    font-weight: 600;
    color: #333;
    font-size: 14px;
  }
  .resume-builder-wrap input[type="text"],
  .resume-builder-wrap textarea {
    width: 100%;
    padding: 12px;
    border: 2px solid #e0e0e0;
    border-radius: 8px;
    font-size: 14px;
    transition: border-color 0.3s;
    font-family: inherit;
  }
  .resume-builder-wrap input:focus,
  .resume-builder-wrap textarea:focus {
    outline: none;
    border-color: #e37e5f;
  }

  /* Resume preview styles */
  #resumePreview {
    background: transparent;
    padding: 0;
    min-height: auto;
  }
  .resume-page {
    background: white;
    width: 8.5in;
    height: 11in;
    padding: 0.6in;
    margin: 0 auto 20px auto;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
    border: 2px dashed #e37e5f;
    box-sizing: border-box;
    position: relative;
    overflow: hidden;
    color: #000;
    font-family: "Computer Modern", "Times New Roman", serif;
    line-height: 1.4;
    font-size: 11pt;
  }
  .resume-header {
    display: flex;
    align-items: center;
    gap: 20px;
    margin-bottom: 15px;
    border-bottom: 1.5px solid #000;
    padding-bottom: 12px;
    text-align: right;
  }
  .resume-portrait {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    object-fit: cover;
    border: 0.5px solid #000;
    flex-shrink: 0;
  }
  .resume-header-details { flex-grow: 1; }
  .resume-name {
    font-size: 24pt;
    font-weight: bold;
    letter-spacing: 2px;
    margin-bottom: 2px;
    font-variant: small-caps;
    line-height: 1.1;
    color: #000;
  }
  .resume-title {
    font-size: 11pt;
    font-weight: bold;
    color: #444;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-bottom: 5px;
  }
  .resume-contact { font-size: 9.5pt; margin: 0; color: #333; }
  .resume-contact a { color: #000; text-decoration: none; }
  .resume-section {
    margin: 15px 0;
  }
  .resume-section-title {
    font-size: 14pt;
    font-weight: bold;
    border-bottom: 1px solid #000;
    margin: 12px 0 8px 0;
    padding-bottom: 2px;
  }
  .resume-item { margin: 10px 0; }
  .resume-item-header {
    display: flex;
    justify-content: space-between;
    font-weight: bold;
    margin-bottom: 2px;
  }
  .resume-item-subtitle {
    font-style: italic;
    margin-bottom: 5px;
  }
  .resume-item-location {
    font-style: italic;
    text-align: right;
    font-size: 10pt;
  }
  .resume-list {
    margin-left: 20px;
    margin-top: 5px;
    list-style: none;
  }
  .resume-list li {
    margin: 3px 0;
    text-indent: -20px;
    padding-left: 20px;
  }
  .resume-list li:before { content: "• "; }
  .coursework-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 5px;
    margin-left: 20px;
    list-style: none;
  }
  .coursework-grid li:before { content: "• "; }
  .skills-section { margin-left: 0; }
  .skill-item { margin: 5px 0; }
  .skill-label { font-weight: bold; }
  .action-buttons {
    display: flex;
    gap: 10px;
    margin-top: 20px;
  }
  #resumePreview h1 { color: #000; }

  @media print {
    body { background: white; padding: 0; margin: 0; }
    .sidebar, .sidebar *, .page-header,
    .resume-builder-wrap .config-panel { display: none !important; }
    .resume-builder-wrap .container {
      display: block !important;
      max-width: 100% !important;
      gap: 0 !important;
    }
    .resume-builder-wrap .preview-panel {
      box-shadow: none !important;
      padding: 0 !important;
      margin: 0 !important;
      border-radius: 0 !important;
      background: transparent !important;
      overflow: visible !important;
      display: block !important;
    }
    .resume-page {
      margin: 0 !important;
      box-shadow: none !important;
      border: none !important;
      padding: 0.6in !important;
      width: 8.5in !important;
      height: 11in !important;
      page-break-after: always !important;
      break-after: page !important;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
    .action-buttons { display: none !important; }
    .main { margin-left: 0 !important; }
  }
</style>
<script src="/static/resume-builder/script.js"></script>
<script>
  // Pass the ?resume= query param to the script
  const params = new URLSearchParams(window.location.search);
  const resumePath = params.get('resume');
  if (resumePath) {
    window.__resumeBuilderPath = resumePath;
  }
</script>
{% endblock %}
